---
name: Home Assistant requirements

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  DEFAULT_PYTHON: "3.14"

jobs:
  hassfest:
    name: hassfest dependency rules
    runs-on: ubuntu-latest
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Poetry
        run: pipx install poetry
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Build package
        run: poetry build --no-interaction
      - name: Install package into a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/check"
          "${RUNNER_TEMP}/check/bin/pip" install --quiet dist/*.whl packaging
      - name: Check dependency tree against hassfest rules
        run: '"${RUNNER_TEMP}/check/bin/python" script/check_ha_requirements.py aioipp'
